name: Build for iOS
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_iOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift build (iOS)
        run: xcrun xcodebuild clean build -quiet -scheme DynamicUI -destination generic/platform=iOS
