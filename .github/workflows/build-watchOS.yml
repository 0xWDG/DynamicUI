name: Build for watchOS
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_watchOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift build (watchOS)
        run: xcrun xcodebuild clean build -quiet -scheme DynamicUI -destination generic/platform=watchOS
