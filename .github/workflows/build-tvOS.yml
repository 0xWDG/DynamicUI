name: Build for tvOS
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_tvOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift build (tvOS)
        run: xcrun xcodebuild clean build -quiet -scheme DynamicUI -destination generic/platform=tvOS
